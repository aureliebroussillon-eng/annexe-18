<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collecte Présence</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; }
        header { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); color: white; padding: 16px; text-align: center; }
        header h1 { font-size: 18px; font-weight: 600; }
        main { padding: 16px; }
        .screen { display: none; }
        .screen.active { display: block; }
        h2 { font-size: 22px; color: #1e40af; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        select, input[type="date"], input[type="text"] { width: 100%; padding: 12px; border: 2px solid #1e40af; border-radius: 6px; font-size: 16px; font-family: inherit; background: white; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
        .btn-primary { background: #16a34a; color: white; }
        .btn-secondary { background: #1e40af; color: white; font-size: 13px; }
        .btn-validate { background: #ea580c; color: white; }
        .btn-validate:disabled { background: #ccc; cursor: not-allowed; }
        .btn-export { background: #7c3aed; color: white; font-size: 13px; }
        .nav-row { display: flex; gap: 8px; padding: 8px 16px; background: white; border-bottom: 1px solid #e5e7eb; }
        .nav-row button { flex: 1; margin-top: 0; font-size: 12px; }
        .saisie-header { background: #f0f9ff; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
        .saisie-header strong { display: block; font-size: 15px; color: #1e40af; }
        .saisie-legend { background: #f3f4f6; padding: 8px 12px; border-radius: 4px; font-size: 12px; margin-bottom: 12px; color: #666; }
        .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; margin-top: 8px; }
        .progress-fill { height: 100%; background: #16a34a; transition: width 0.3s; }
        .usager-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .usager-name { font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #1e3a8a; }
        .status-buttons { display: flex; gap: 8px; margin-bottom: 8px; }
        .status-btn { flex: 1; padding: 10px; border: 2px solid #ddd; background: white; border-radius: 4px; font-weight: 700; font-size: 14px; cursor: pointer; margin: 0; }
        .status-btn.selected { border-color: #1e40af; background: #1e40af; color: white; }
        .comment-field { display: none; margin-top: 8px; }
        .comment-field textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; min-height: 50px; font-family: inherit; }
        .comment-label { font-size: 12px; color: #666; margin-top: 4px; }
        .comment-required { color: #dc2626; font-weight: 600; }
        .validation-section { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 6px; padding: 16px; margin-top: 20px; margin-bottom: 100px; }
        .validation-section h3 { margin-bottom: 12px; color: #92400e; font-size: 14px; }
        .validation-fixed { position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto; background: white; border-top: 1px solid #e5e7eb; padding: 12px 16px; box-shadow: 0 -2px 8px rgba(0,0,0,0.1); z-index: 99; }
        .validation-fixed button { margin-top: 0; }
        .alert { background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; border-left: 4px solid #16a34a; }
        .historique-item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
        .historique-item strong { display: block; color: #1e3a8a; margin-bottom: 4px; }
        .historique-item small { display: block; color: #666; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
        table th, table td { border: 1px solid #e5e7eb; padding: 8px; text-align: left; }
        table th { background: #f0f9ff; color: #1e40af; font-weight: 600; }
        .summary-stats { background: #f0f9ff; padding: 12px; border-radius: 6px; margin-top: 16px; margin-bottom: 16px; font-size: 13px; }
        .summary-stats p { margin-bottom: 8px; }
        .summary-stats strong { color: #1e40af; }
        .aj-section { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px; padding: 12px; margin-top: 16px; font-size: 13px; }
        .aj-section h4 { color: #92400e; margin-bottom: 8px; }
        .aj-item { background: white; padding: 8px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Collecte et transmission des journées de présence</h1>
        </header>

        <nav class="nav-row">
            <button class="btn-secondary" id="btn-accueil">Accueil</button>
            <button class="btn-secondary" id="btn-histo">Historique</button>
            <button class="btn-secondary" id="btn-monthly">Mensuel</button>
        </nav>

        <main>
            <div id="accueil" class="screen active">
                <h2>Collecte de présence</h2>
                <div class="form-group">
                    <label for="site">Site / Dispositif</label>
                    <select id="site">
                        <option value="">-- Choisir --</option>
                        <option value="site1">Site 1</option>
                        <option value="site2">Site 2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>
                <button class="btn-primary" id="btn-start">Commencer la saisie</button>
            </div>

            <div id="saisie" class="screen">
                <div class="saisie-header">
                    <strong id="site-name">Site</strong>
                    <span id="date-display">Date</span>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress"></div>
                    </div>
                    <div style="margin-top: 8px; font-weight: 600;" id="progress-text">0 / 10</div>
                </div>
                <div class="saisie-legend">
                    <strong>P :</strong> Présence | <strong>A :</strong> Absence | <strong>AJ :</strong> Autre situation à justifier
                </div>
                <div id="alerts-box"></div>
                <div id="usagers-list"></div>
                <div class="validation-section">
                    <h3>Validation de la journée</h3>
                    <div class="form-group">
                        <label for="name-input">Prénom / NOM</label>
                        <input type="text" id="name-input" placeholder="Ex: Jean / DUPONT">
                    </div>
                </div>
            </div>

            <div class="validation-fixed">
                <button class="btn-validate" id="btn-val">Valider la journée</button>
            </div>

            <div id="historique" class="screen">
                <h2>Historique</h2>
                <div id="histo-list"></div>
                <button class="btn-secondary" id="btn-back-histo" style="margin-top: 16px;">Retour</button>
            </div>

            <div id="monthly" class="screen">
                <h2>Vue mensuelle</h2>
                <div class="form-group">
                    <label for="month-input">Période</label>
                    <select id="month-input">
                        <option value="">-- Choisir --</option>
                    </select>
                </div>
                <div id="monthly-data"></div>
                <div id="monthly-exports" style="margin-top: 16px; display: none;">
                    <button class="btn-export" id="btn-export-excel">Exporter Excel</button>
                    <button class="btn-export" id="btn-export-pdf">Exporter / Imprimer PDF</button>
                    <button class="btn-export" id="btn-prepare-transmission">Préparer transmission</button>
                </div>
                <button class="btn-secondary" id="btn-back-monthly" style="margin-top: 16px;">Retour</button>
            </div>
        </main>
    </div>

    <script>
        var APP = {
            site1: ['Alice', 'Bob', 'Charlie', 'David', 'Emma', 'Frank', 'Grace', 'Henry', 'Iris', 'Jack'],
            site2: ['Kate', 'Leo', 'Mia', 'Noah', 'Olive', 'Peter', 'Quinn', 'Rachel', 'Sam', 'Tara']
        };

        var currentSite = '';
        var currentDate = '';
        var currentData = null;

        function newDay() {
            var data = { validated: false, by: '', at: '', validations: [], usagers: {} };
            var usagers = currentSite === 'site1' ? APP.site1 : APP.site2;
            for (var i = 0; i < usagers.length; i++) {
                data.usagers[usagers[i]] = { status: '', comment: '' };
            }
            return data;
        }

        function getSaisie(site, date) {
            var key = 'saisie_' + site + '_' + date;
            var stored = localStorage.getItem(key);
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch (e) {
                    console.error('Parse error:', e);
                    return newDay();
                }
            }
            return newDay();
        }

        function saveSaisie(site, date, data) {
            var key = 'saisie_' + site + '_' + date;
            localStorage.setItem(key, JSON.stringify(data));
            console.log('Saved:', key);
        }

        function showScreen(name) {
            var screens = document.querySelectorAll('.screen');
            for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
            document.getElementById(name).classList.add('active');
        }

        document.getElementById('btn-start').addEventListener('click', function() {
            var site = document.getElementById('site').value;
            var date = document.getElementById('date').value;
            if (!site || !date) { alert('Sélectionner site et date'); return; }
            currentSite = site;
            currentDate = date;
            currentData = getSaisie(site, date);
            var siteName = site === 'site1' ? 'Site 1' : 'Site 2';
            document.getElementById('site-name').textContent = siteName;
            document.getElementById('date-display').textContent = new Date(date + 'T00:00:00').toLocaleDateString('fr-FR');
            renderSaisie();
            showScreen('saisie');
        });

        function renderSaisie() {
            var container = document.getElementById('usagers-list');
            container.innerHTML = '';
            var usagers = currentSite === 'site1' ? APP.site1 : APP.site2;
            for (var i = 0; i < usagers.length; i++) {
                var u = usagers[i];
                var status = currentData.usagers[u];
                var card = document.createElement('div');
                card.className = 'usager-card';
                card.innerHTML = '<div class="usager-name">' + u + '</div><div class="status-buttons"></div><div class="comment-field"><textarea data-user="' + u + '" placeholder="Préciser..."></textarea><div class="comment-label">Ce champ est <span class="comment-required">obligatoire</span> pour AJ</div></div>';
                container.appendChild(card);

                var buttonDiv = card.querySelector('.status-buttons');
                for (var j = 0; j < 3; j++) {
                    var st = ['P', 'A', 'AJ'][j];
                    var btn = document.createElement('button');
                    btn.className = 'status-btn';
                    btn.textContent = st;
                    btn.dataset.user = u;
                    btn.dataset.status = st;
                    if (status.status === st) btn.classList.add('selected');
                    btn.addEventListener('click', function(e) { handleStatusClick(e); });
                    buttonDiv.appendChild(btn);
                }

                var textarea = card.querySelector('textarea');
                textarea.value = status.comment;
                textarea.addEventListener('change', function() {
                    currentData.usagers[this.dataset.user].comment = this.value;
                    saveSaisie(currentSite, currentDate, currentData);
                    updateProgress();
                });

                var commentDiv = card.querySelector('.comment-field');
                if (status.status === 'AJ' || status.comment) commentDiv.style.display = 'block';
            }
            updateProgress();
        }

        function handleStatusClick(e) {
            var btn = e.target;
            var user = btn.dataset.user;
            var status = btn.dataset.status;

            if (currentData.validated) {
                currentData.validated = false;
                currentData.by = '';
                currentData.at = '';
            }

            if (currentData.usagers[user].status === status) {
                currentData.usagers[user].status = '';
                currentData.usagers[user].comment = '';
            } else {
                currentData.usagers[user].status = status;
                if (status !== 'AJ') currentData.usagers[user].comment = '';
            }

            saveSaisie(currentSite, currentDate, currentData);
            renderSaisie();
            updateProgress();
        }

        function updateProgress() {
            var usagers = currentSite === 'site1' ? APP.site1 : APP.site2;
            var count = 0;
            for (var i = 0; i < usagers.length; i++) {
                var u = usagers[i];
                var s = currentData.usagers[u];
                if (s.status === 'AJ') { if (s.comment && s.comment.trim()) count++; }
                else if (s.status) count++;
            }
            var pct = Math.round((count / usagers.length) * 100);
            document.getElementById('progress').style.width = pct + '%';
            document.getElementById('progress-text').textContent = count + ' / ' + usagers.length + ' renseignés';
            document.getElementById('btn-val').disabled = (count !== usagers.length) || currentData.validated;
        }

        document.getElementById('btn-val').addEventListener('click', function() {
            var name = document.getElementById('name-input').value.trim();
            if (!name) { alert('Entrer Prénom/NOM'); return; }
            var now = new Date();
            var time = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
            currentData.validated = true;
            currentData.by = name;
            currentData.at = time;
            if (!currentData.validations) currentData.validations = [];
            currentData.validations.push({ by: name, at: time });
            saveSaisie(currentSite, currentDate, currentData);
            document.getElementById('name-input').value = '';
            var msg = document.createElement('div');
            msg.className = 'alert';
            msg.textContent = '✓ Validée par ' + name + ' à ' + time;
            document.getElementById('alerts-box').appendChild(msg);
            updateProgress();
        });

        document.getElementById('btn-accueil').addEventListener('click', function() { showScreen('accueil'); });

        document.getElementById('btn-histo').addEventListener('click', function() {
            var container = document.getElementById('histo-list');
            container.innerHTML = '';
            var items = [];
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (key.indexOf('saisie_') === 0) {
                    var parts = key.split('_');
                    var site = parts[1];
                    var date = parts[2];
                    var data = JSON.parse(localStorage.getItem(key));
                    items.push({ site: site === 'site1' ? 'Site 1' : 'Site 2', siteId: site, date: date, data: data });
                }
            }
            items.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
            if (items.length === 0) container.innerHTML = '<p style="color: #999;">Aucune saisie</p>';
            else {
                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var div = document.createElement('div');
                    div.className = 'historique-item';
                    var dateStr = new Date(item.date + 'T00:00:00').toLocaleDateString('fr-FR');
                    div.innerHTML = '<strong>' + item.site + '</strong><small>' + dateStr + '</small>';
                    if (item.data.validated) {
                        var nb = (item.data.validations && item.data.validations.length > 0) ? item.data.validations.length : 1;
                        var last = item.data.validations && item.data.validations.length > 0 ? item.data.validations[item.data.validations.length - 1] : { by: item.data.by, at: item.data.at };
                        div.innerHTML += '<small style="color: #16a34a; display: block; margin-top: 4px;">✓ ' + last.by + ' à ' + last.at + (nb > 1 ? ' (' + nb + ' validations)' : '') + '</small>';
                    }
                    (function(site, date, data) {
                        div.addEventListener('click', function() {
                            currentSite = site;
                            currentDate = date;
                            currentData = data;
                            var siteName = site === 'site1' ? 'Site 1' : 'Site 2';
                            document.getElementById('site-name').textContent = siteName;
                            document.getElementById('date-display').textContent = new Date(date + 'T00:00:00').toLocaleDateString('fr-FR');
                            renderSaisie();
                            showScreen('saisie');
                        });
                    })(item.siteId, item.date, item.data);
                    container.appendChild(div);
                }
            }
            showScreen('historique');
        });

        document.getElementById('btn-back-histo').addEventListener('click', function() { showScreen('accueil'); });

        document.getElementById('btn-monthly').addEventListener('click', function() {
            window.monthlyData = null;
            document.getElementById('monthly-data').innerHTML = '';
            document.getElementById('monthly-exports').style.display = 'none';
            var select = document.getElementById('month-input');
            select.innerHTML = '<option value="">-- Choisir --</option>';
            var months = {};
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (key.indexOf('saisie_') === 0) {
                    var parts = key.split('_');
                    var site = parts[1];
                    var date = parts[2];
                    var ym = date.substring(0, 7);
                    if (!months[ym]) months[ym] = {};
                    if (!months[ym][site]) months[ym][site] = true;
                }
            }
            var ymList = Object.keys(months).sort().reverse();
            for (var i = 0; i < ymList.length; i++) {
                var ym = ymList[i];
                var sites = Object.keys(months[ym]);
                for (var j = 0; j < sites.length; j++) {
                    var site = sites[j];
                    var opt = document.createElement('option');
                    opt.value = site + '|' + ym;
                    var siteName = site === 'site1' ? 'Site 1' : 'Site 2';
                    var y = ym.substring(0, 4);
                    var m = ym.substring(5, 7);
                    var monthName = new Date(y, m - 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
                    opt.textContent = siteName + ' – ' + monthName;
                    select.appendChild(opt);
                }
            }
            showScreen('monthly');
        });

        document.getElementById('month-input').addEventListener('change', function() {
            if (!this.value) { document.getElementById('monthly-data').innerHTML = ''; document.getElementById('monthly-exports').style.display = 'none'; return; }
            var parts = this.value.split('|');
            var site = parts[0];
            var ym = parts[1];
            var usagers = site === 'site1' ? APP.site1 : APP.site2;
            var summary = {};
            var allAJ = [];
            var completeDays = 0;
            var totalDays = 0;
            var daysInMonth = {};
            
            for (var i = 0; i < usagers.length; i++) summary[usagers[i]] = { P: 0, A: 0, AJ: 0 };
            
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (key.indexOf('saisie_') === 0) {
                    var kparts = key.split('_');
                    var ksite = kparts[1];
                    var kdate = kparts[2];
                    if (ksite === site && kdate.substring(0, 7) === ym) {
                        var data = JSON.parse(localStorage.getItem(key));
                        daysInMonth[kdate] = data;
                        for (var j = 0; j < usagers.length; j++) {
                            var u = usagers[j];
                            var status = data.usagers[u].status;
                            if (status === 'P') summary[u].P++;
                            else if (status === 'A') summary[u].A++;
                            else if (status === 'AJ') summary[u].AJ++;
                            if (status === 'AJ' && data.usagers[u].comment) {
                                allAJ.push({ date: kdate, user: u, comment: data.usagers[u].comment });
                            }
                        }
                        if (data.validated) completeDays++;
                        totalDays++;
                    }
                }
            }

            var html = '<table><tr><th>Usager</th><th>P</th><th>A</th><th>AJ</th></tr>';
            var tP = 0, tA = 0, tAJ = 0;
            for (var i = 0; i < usagers.length; i++) {
                var u = usagers[i];
                var s = summary[u];
                html += '<tr><td>' + u + '</td><td>' + s.P + '</td><td>' + s.A + '</td><td>' + s.AJ + '</td></tr>';
                tP += s.P; tA += s.A; tAJ += s.AJ;
            }
            html += '<tr style="background: #f0f9ff; font-weight: 600;"><td>TOTAL</td><td>' + tP + '</td><td>' + tA + '</td><td>' + tAJ + '</td></tr></table>';
            
            var incompleteDays = totalDays - completeDays;
            var status = incompleteDays === 0 ? 'Période complète' : 'Période à compléter (' + incompleteDays + ' j.)';
            var summaryHtml = '<div class="summary-stats"><p><strong>' + completeDays + '</strong> jour(s) validé(s)</p><p><strong>' + incompleteDays + '</strong> jour(s) à compléter</p><p style="margin-top: 8px; border-top: 1px solid #bfdbfe; padding-top: 8px;"><strong style="color: ' + (incompleteDays === 0 ? '#16a34a' : '#f59e0b') + ';">' + status + '</strong></p></div>';
            
            var ajHtml = '';
            if (allAJ.length > 0) {
                ajHtml = '<div class="aj-section"><h4>AJ à examiner (' + allAJ.length + ')</h4>';
                for (var i = 0; i < allAJ.length; i++) {
                    var aj = allAJ[i];
                    var dateStr = new Date(aj.date + 'T00:00:00').toLocaleDateString('fr-FR');
                    ajHtml += '<div class="aj-item"><strong>' + aj.user + '</strong> – ' + dateStr + '<br>' + aj.comment + '</div>';
                }
                ajHtml += '</div>';
            }

            document.getElementById('monthly-data').innerHTML = summaryHtml + html + ajHtml;
            document.getElementById('monthly-exports').style.display = 'block';
            
            window.monthlyData = { site: site, siteName: site === 'site1' ? 'Site 1' : 'Site 2', ym: ym, summary: summary, usagers: usagers, allAJ: allAJ, completeDays: completeDays, totalDays: totalDays, incompleteDays: incompleteDays, daysInMonth: daysInMonth };
        });

        function csvEscape(s) {
            if (!s) return '';
            if (typeof s !== 'string') s = String(s);
            if (s.indexOf(',') > -1 || s.indexOf('"') > -1 || s.indexOf('\n') > -1) {
                return '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
        }

        function downloadCSV(filename, content) {
            var blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            var url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('btn-export-excel').addEventListener('click', function() {
            var data = window.monthlyData;
            if (!data) { alert('Aucune donnée'); return; }
            
            var y = data.ym.substring(0, 4);
            var m = data.ym.substring(5, 7);
            var monthName = new Date(y, m - 1).toLocaleDateString('fr-FR', { month: 'long' });
            var filename = 'Presences_' + data.siteName.replace(' ', '') + '_' + monthName + '_' + y + '.csv';
            
            var lines = [];
            lines.push('SYNTHÈSE MENSUELLE');
            lines.push(data.siteName + ' - ' + monthName + ' ' + y);
            lines.push('');
            lines.push('Usager,P,A,AJ');
            var tP = 0, tA = 0, tAJ = 0;
            for (var i = 0; i < data.usagers.length; i++) {
                var u = data.usagers[i];
                var s = data.summary[u];
                lines.push(csvEscape(u) + ',' + s.P + ',' + s.A + ',' + s.AJ);
                tP += s.P; tA += s.A; tAJ += s.AJ;
            }
            lines.push('TOTAL,' + tP + ',' + tA + ',' + tAJ);
            lines.push('');
            lines.push(data.completeDays + ' jour(s) validé(s) / ' + data.incompleteDays + ' jour(s) à compléter');
            
            downloadCSV(filename, lines.join('\n'));
        });

        document.getElementById('btn-export-pdf').addEventListener('click', function() {
            var data = window.monthlyData;
            if (!data) { alert('Aucune donnée'); return; }
            
            var y = data.ym.substring(0, 4);
            var m = data.ym.substring(5, 7);
            var monthName = new Date(y, m - 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
            var now = new Date();
            var dateStr = now.toLocaleDateString('fr-FR');
            
            var html = `<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bordereau</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e40af; padding-bottom: 15px; }
        .header h1 { margin: 0; color: #1e40af; font-size: 20px; }
        .header p { margin: 5px 0; font-size: 13px; }
        .section { margin-bottom: 25px; }
        .section h3 { background: #f0f9ff; padding: 10px; margin: 0 0 10px 0; color: #1e40af; border-left: 4px solid #1e40af; font-size: 14px; }
        .info-row { display: flex; margin-bottom: 8px; font-size: 13px; }
        .info-label { font-weight: 600; width: 140px; }
        .info-value { flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        table th, table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        table th { background: #f0f9ff; color: #1e40af; font-weight: 600; }
        .alert { background: #fef3c7; border-left: 3px solid #f59e0b; padding: 10px; margin-top: 15px; font-size: 12px; }
        @media print {
            body { margin: 0; }
            button { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Bordereau de transmission</h1>
        <p>Collecte des journées de présence</p>
    </div>
    
    <div class="section">
        <h3>Synthèse de la période</h3>
        <div class="info-row">
            <div class="info-label">Site / Dispositif :</div>
            <div class="info-value"><strong>${data.siteName}</strong></div>
        </div>
        <div class="info-row">
            <div class="info-label">Période :</div>
            <div class="info-value"><strong>${monthName}</strong></div>
        </div>
        <div class="info-row">
            <div class="info-label">Journées validées :</div>
            <div class="info-value"><strong>${data.completeDays}</strong></div>
        </div>
        <div class="info-row">
            <div class="info-label">Journées à compléter :</div>
            <div class="info-value"><strong>${data.incompleteDays}</strong></div>
        </div>
    </div>
    
    <div class="section">
        <h3>Complétude des données</h3>
        <table>
            <tr>
                <th>Usager</th>
                <th>P</th>
                <th>A</th>
                <th>AJ</th>
            </tr>`;
            
            var tP = 0, tA = 0, tAJ = 0;
            for (var i = 0; i < data.usagers.length; i++) {
                var u = data.usagers[i];
                var s = data.summary[u];
                html += `<tr><td>${u}</td><td>${s.P}</td><td>${s.A}</td><td>${s.AJ}</td></tr>`;
                tP += s.P; tA += s.A; tAJ += s.AJ;
            }
            html += `<tr style="background: #f0f9ff; font-weight: 600;"><td>TOTAL</td><td>${tP}</td><td>${tA}</td><td>${tAJ}</td></tr></table>
    </div>`;
            
            if (data.allAJ.length > 0) {
                html += `<div class="section"><h3>Autres situations à examiner (${data.allAJ.length})</h3><table><tr><th>Date</th><th>Usager</th><th>Observation</th></tr>`;
                for (var i = 0; i < data.allAJ.length; i++) {
                    var aj = data.allAJ[i];
                    html += `<tr><td>${aj.date}</td><td>${aj.user}</td><td>${aj.comment}</td></tr>`;
                }
                html += `</table></div>`;
            }
            
            html += `<div class="section"><h3>Informations administratives</h3>
        <div class="info-row">
            <div class="info-label">Document généré :</div>
            <div class="info-value">${dateStr}</div>
        </div>
    </div>
    
    <div class="alert">
        <strong>À imprimer et transmettre au service administratif</strong>
    </div>
    
    <button onclick="window.print()" style="margin-top: 20px; padding: 12px 20px; background: #1e40af; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;">Imprimer / Enregistrer PDF</button>
</body>
</html>`;
            
            var w = window.open('', 'bordereau', 'height=600,width=800');
            w.document.write(html);
            w.document.close();
        });

        document.getElementById('btn-prepare-transmission').addEventListener('click', function() {
            alert('Bordereau prêt à transmettre : ' + window.monthlyData.siteName + ' - ' + window.monthlyData.ym);
        });

        document.getElementById('btn-back-monthly').addEventListener('click', function() { showScreen('accueil'); });

        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
